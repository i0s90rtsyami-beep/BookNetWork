<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>本の棚</title>
<style>
  :root { --bg:#faf8f5; --fg:#2b2622; --sub:#7a7068; --line:#e3ddd5; --accent:#8a5a3c; --chip:#efe9e1; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#1d1a17; --fg:#ece6df; --sub:#a39a90; --line:#3a352f; --accent:#d4a27f; --chip:#2b2723; }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:16px/1.6 system-ui, "Hiragino Sans", "Noto Sans JP", sans-serif; }
  main { max-width:640px; margin:0 auto; padding:16px; }
  h1 { font-size:1.2rem; margin:8px 0 12px; }
  input[type=search] { width:100%; padding:12px; font-size:1rem; border:1px solid var(--line); border-radius:8px; background:var(--bg); color:var(--fg); }
  .hint { color:var(--sub); font-size:.85rem; margin:6px 0 12px; }
  ul { list-style:none; margin:0; padding:0; }
  li.book { border-top:1px solid var(--line); padding:12px 0; cursor:pointer; }
  li.book:last-child { border-bottom:1px solid var(--line); }
  .title { font-weight:600; }
  .meta { color:var(--sub); font-size:.9rem; }
  .badge { display:inline-block; font-size:.75rem; padding:0 8px; border-radius:99px; background:var(--chip); color:var(--sub); margin-left:6px; }
  .badge.own { color:var(--accent); }
  .chip { display:inline-block; font-size:.8rem; padding:2px 10px; margin:4px 6px 0 0; border-radius:99px; background:var(--chip); }
  button.link { background:none; border:none; color:var(--accent); font:inherit; padding:0; cursor:pointer; }
  h2 { font-size:1rem; margin:24px 0 4px; }
  #error { color:#b3261e; }
</style>
</head>
<body>
<main>
  <h1>本の棚</h1>
  <div id="app">読み込み中…</div>
</main>

<script>
// ===== 1. 設定：公開したCSVのURL =====
const BOOKS_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vTo9XTbQjXo9Itk2QbLqiEb9n6m9PPDUyoIdou_2Mb-q9reZJEQEnAYmZKzJjzypidPJ1MGnlNvYIuU/pub?gid=0&single=true&output=csv";
const REFS_URL  = "https://docs.google.com/spreadsheets/d/e/2PACX-1vTo9XTbQjXo9Itk2QbLqiEb9n6m9PPDUyoIdou_2Mb-q9reZJEQEnAYmZKzJjzypidPJ1MGnlNvYIuU/pub?gid=714139465&single=true&output=csv";

// ===== 2. CSVを「行の配列」に変える =====
// 引用符 "..." の中のカンマや改行も正しく扱う
function parseCSV(text) {
  const rows = []; let row = [], cell = "", inQuotes = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (inQuotes) {
      if (c === '"' && text[i+1] === '"') { cell += '"'; i++; }
      else if (c === '"') inQuotes = false;
      else cell += c;
    } else if (c === '"') inQuotes = true;
    else if (c === ",") { row.push(cell); cell = ""; }
    else if (c === "\n" || c === "\r") {
      if (c === "\r" && text[i+1] === "\n") i++;
      row.push(cell); rows.push(row); row = []; cell = "";
    } else cell += c;
  }
  if (cell !== "" || row.length) { row.push(cell); rows.push(row); }
  return rows;
}

// 1行目の見出しを使って、各行を {見出し: 値} のオブジェクトにする
// 見出し・値の前後の空白は取り除く（A1のような空白だけの見出しも「ID」扱いにする）
function toObjects(rows) {
  const head = rows[0].map(h => h.trim());
  if (head[0] === "") head[0] = "ID";
  return rows.slice(1)
    .map(r => Object.fromEntries(head.map((h, i) => [h, (r[i] || "").trim()])))
    .filter(o => o["ID"] !== "");           // IDが空の行（空行）は捨てる
}

// ===== 3. データの読み込み =====
let books = [], byId = {}, outgoing = {}, incoming = {};

const split = s => (s || "").split(/[;；]/).map(x => x.trim()).filter(Boolean);
const isOwned = b => ["○", "〇", "◯"].includes(b["所持"]);   // 3種類の丸を同じ扱いにする
// 検索用の正規化：全角/半角・大文字小文字の違いを無視する
const norm = s => (s || "").normalize("NFKC").toLowerCase();

async function load() {
  const [b, r] = await Promise.all([BOOKS_URL, REFS_URL].map(u =>
    fetch(u).then(res => { if (!res.ok) throw new Error(res.status); return res.text(); })));
  books = toObjects(parseCSV(b));
  books.forEach(x => byId[x["ID"]] = x);
  toObjects(parseCSV(r.replace(/^元の本のID/, "ID"))).forEach(x => {   // 1列目を「ID」に読み替え
    const from = x["ID"], to = x["参照先ID"];
    (outgoing[from] ||= []).push({ id: to, kind: x["種別"] });
    (incoming[to]   ||= []).push({ id: from, kind: x["種別"] });
  });
}

// ===== 4. 画面の描画 =====
const app = document.getElementById("app");
const esc = s => s.replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function bookLi(b, extra = "") {
  return `<li class="book" data-id="${esc(b["ID"])}">
    <div class="title">${esc(b["書名"])}${isOwned(b) ? '<span class="badge own">所持</span>' : '<span class="badge">未所持</span>'}</div>
    <div class="meta">${esc(b["著者"])}　${esc(b["出版者"])} ${esc(b["出版年"])}${extra}</div></li>`;
}

function renderList(q = "") {
  const nq = norm(q);
  // 検索語が空 → 手持ちの本だけ／検索語あり → 未所持も含めて検索
  const hits = books.filter(b => nq
    ? norm(["書名","著者","出版者","件名","タグ","メモ"].map(k => b[k]).join(" ")).includes(nq)
    : isOwned(b));
  app.innerHTML = `
    <input type="search" id="q" placeholder="書名・著者・件名・タグで検索" value="${esc(q)}">
    <div class="hint">${nq ? `${hits.length}件（未所持も含む）` : `手持ちの本 ${hits.length}冊（検索すると未所持の本も探せます）`}</div>
    <ul>${hits.map(b => bookLi(b)).join("")}</ul>`;
  const input = document.getElementById("q");
  input.addEventListener("input", e => renderList(e.target.value));
  if (q) { input.focus(); input.setSelectionRange(q.length, q.length); }
}

function renderDetail(id) {
  const b = byId[id];
  if (!b) return renderList();
  const refs = (list) => list && list.length
    ? `<ul>${list.map(x => byId[x.id] ? bookLi(byId[x.id], x.kind ? `<span class="badge">${esc(x.kind)}</span>` : "") : "").join("")}</ul>`
    : `<div class="meta">なし</div>`;
  app.innerHTML = `
    <button class="link" id="back">← 一覧へ</button>
    <h2 style="font-size:1.15rem">${esc(b["書名"])}</h2>
    <div class="meta">${esc(b["著者"])}</div>
    <div class="meta">${esc(b["出版者"])} ${esc(b["出版年"])}　${isOwned(b) ? "所持" : "未所持"}</div>
    <div>${split(b["件名"]).map(s => `<span class="chip">${esc(s)}</span>`).join("")}</div>
    <div>${split(b["タグ"]).map(s => `<span class="chip">#${esc(s)}</span>`).join("")}</div>
    ${b["メモ"] ? `<p>${esc(b["メモ"])}</p>` : ""}
    <h2>この本が紹介している本</h2>${refs(outgoing[id])}
    <h2>この本を紹介している本</h2>${refs(incoming[id])}`;
  document.getElementById("back").onclick = () => { location.hash = ""; };
  window.scrollTo(0, 0);
}

// 本をタップ → URLの # にIDを入れて詳細へ（戻るボタンも効く）
app.addEventListener("click", e => {
  const li = e.target.closest("li.book");
  if (li) location.hash = li.dataset.id;
});
function route() {
  const id = decodeURIComponent(location.hash.slice(1));
  id ? renderDetail(id) : renderList();
}
window.addEventListener("hashchange", route);

load().then(route).catch(err => {
  app.innerHTML = `<p id="error">データを読み込めませんでした（${esc(String(err.message || err))}）。</p>
    <p class="meta">スプレッドシートの「ウェブに公開」が有効か、URLが正しいかを確認してください。</p>`;
});
</script>
</body>
</html>
